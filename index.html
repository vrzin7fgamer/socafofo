<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TREMBALA - Logo 1:1 (1536x1536)</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%;
    background:#050505;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:'Arial Black', sans-serif;
  }

  .square {
    position:relative;
    width:min(95vmin, 1536px);
    aspect-ratio:1/1;
    background:
      radial-gradient(circle at 50% 45%, #1f0f00 0%, #0a0500 55%, #000 100%);
    border-radius:24px;
    overflow:hidden;
    box-shadow:
      0 0 60px rgba(255,107,0,0.5),
      inset 0 0 80px rgba(255,60,0,0.2);
  }

  .frame {
    position:absolute; inset:14px;
    border:2px solid #ff6b00;
    border-radius:18px;
    box-shadow: inset 0 0 30px rgba(255,107,0,0.35);
    z-index:6;
    animation: frameGlow 2.4s ease-in-out infinite;
    pointer-events:none;
  }
  .frame::before {
    content:""; position:absolute; inset:8px;
    border:1px dashed rgba(255,107,0,0.4);
    border-radius:12px;
  }
  @keyframes frameGlow {
    0%,100% { box-shadow: inset 0 0 30px rgba(255,107,0,0.35), 0 0 0 rgba(255,107,0,0); }
    50%     { box-shadow: inset 0 0 50px rgba(255,170,0,0.6),  0 0 25px rgba(255,107,0,0.6); }
  }

  .grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,107,0,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,107,0,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    animation: gridMove 10s linear infinite;
    z-index:1;
  }
  @keyframes gridMove { to { background-position:48px 48px; } }

  .sun {
    position:absolute;
    top:50%; left:50%;
    width:85%; height:85%;
    transform:translate(-50%,-50%);
    background:
      radial-gradient(circle, rgba(255,170,0,0.55) 0%, rgba(255,80,0,0.28) 35%, transparent 65%);
    filter:blur(24px);
    animation: pulse 3s ease-in-out infinite;
    z-index:1;
  }
  @keyframes pulse {
    0%,100% { transform:translate(-50%,-50%) scale(1);    opacity:0.7; }
    50%     { transform:translate(-50%,-50%) scale(1.15); opacity:1; }
  }

  .rays {
    position:absolute;
    top:50%; left:50%;
    width:130%; height:130%;
    transform:translate(-50%,-50%);
    background:
      conic-gradient(from 0deg,
        transparent 0deg, rgba(255,107,0,0.2) 8deg, transparent 16deg,
        transparent 30deg, rgba(255,107,0,0.2) 38deg, transparent 46deg,
        transparent 60deg, rgba(255,107,0,0.2) 68deg, transparent 76deg,
        transparent 90deg, rgba(255,107,0,0.2) 98deg, transparent 106deg,
        transparent 120deg, rgba(255,107,0,0.2) 128deg, transparent 136deg,
        transparent 150deg, rgba(255,107,0,0.2) 158deg, transparent 166deg,
        transparent 180deg, rgba(255,107,0,0.2) 188deg, transparent 196deg,
        transparent 210deg, rgba(255,107,0,0.2) 218deg, transparent 226deg,
        transparent 240deg, rgba(255,107,0,0.2) 248deg, transparent 256deg,
        transparent 270deg, rgba(255,107,0,0.2) 278deg, transparent 286deg,
        transparent 300deg, rgba(255,107,0,0.2) 308deg, transparent 316deg,
        transparent 330deg, rgba(255,107,0,0.2) 338deg, transparent 346deg);
    animation: spin 18s linear infinite;
    z-index:1;
  }
  @keyframes spin { to { transform:translate(-50%,-50%) rotate(360deg); } }

  .ring {
    position:absolute;
    top:50%; left:50%;
    width:88%; height:88%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:2px dashed rgba(255,107,0,0.5);
    animation: spinR 14s linear infinite;
    z-index:2;
  }
  @keyframes spinR { to { transform:translate(-50%,-50%) rotate(-360deg); } }

  .ring2 {
    position:absolute;
    top:50%; left:50%;
    width:70%; height:70%;
    transform:translate(-50%,-50%);
    border-radius:50%;
    border:1px solid rgba(255,107,0,0.3);
    z-index:2;
  }

  /* TEXTO PRINCIPAL — reduzido pra caber 100% */
  .mega-wrap {
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:62%;
    z-index:5;
    animation:
      megaIn 1.2s cubic-bezier(.2,.9,.3,1.3) both,
      megaPulse 2.6s ease-in-out 1.4s infinite,
      megaFlicker 4s ease-in-out 1.4s infinite;
    filter:
      drop-shadow(0 0 18px rgba(255,107,0,1))
      drop-shadow(0 0 40px rgba(255,60,0,0.7));
  }
  @keyframes megaIn {
    0%   { opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg); }
    60%  { opacity:1; transform:translate(-50%,-50%) scale(1.06) rotate(1deg); }
    100% { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(0); }
  }
  @keyframes megaPulse {
    0%,100% { transform:translate(-50%,-50%) scale(1); }
    50%     { transform:translate(-50%,-50%) scale(1.025); }
  }
  @keyframes megaFlicker {
    0%,100% { filter: drop-shadow(0 0 18px rgba(255,107,0,1))  drop-shadow(0 0 40px rgba(255,60,0,0.7)); }
    50%     { filter: drop-shadow(0 0 30px rgba(255,200,0,1)) drop-shadow(0 0 70px rgba(255,80,0,0.95)); }
  }
  .mega-wrap svg { width:100%; height:auto; display:block; overflow:visible; }

  .top-tag, .bot-tag {
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:clamp(13px, 2.6vmin, 38px);
    letter-spacing:0.55em;
    color:#ffae00;
    text-shadow:0 0 14px rgba(255,107,0,1);
    z-index:5;
    white-space:nowrap;
    font-weight:700;
  }
  .top-tag { top:18%; animation: fadeDown 1.2s ease-out 0.4s both; }
  .bot-tag { bottom:18%; animation: fadeUp 1.2s ease-out 0.6s both; }
  @keyframes fadeDown {
    0%   { opacity:0; transform:translate(-50%, -30px); }
    100% { opacity:1; transform:translate(-50%, 0); }
  }
  @keyframes fadeUp {
    0%   { opacity:0; transform:translate(-50%, 30px); }
    100% { opacity:1; transform:translate(-50%, 0); }
  }

  .sweep {
    position:absolute; inset:0;
    background:linear-gradient(110deg, transparent 42%, rgba(255,200,0,0.28) 50%, transparent 58%);
    animation: sweep 4.5s ease-in-out infinite;
    z-index:6;
    pointer-events:none;
  }
  @keyframes sweep {
    0%   { transform:translateX(-100%); }
    50%  { transform:translateX(100%); }
    100% { transform:translateX(100%); }
  }

  .ember {
    position:absolute;
    width:5px; height:5px;
    background:#ff6b00;
    border-radius:50%;
    box-shadow:0 0 12px #ffae00;
    animation: rise 5s linear infinite;
    z-index:3;
  }
  .ember:nth-child(1){ left:6%;  bottom:0; animation-delay:0s; }
  .ember:nth-child(2){ left:16%; bottom:0; animation-delay:1.2s; }
  .ember:nth-child(3){ left:28%; bottom:0; animation-delay:2.4s; }
  .ember:nth-child(4){ left:42%; bottom:0; animation-delay:0.6s; }
  .ember:nth-child(5){ left:56%; bottom:0; animation-delay:3s; }
  .ember:nth-child(6){ left:68%; bottom:0; animation-delay:1.8s; }
  .ember:nth-child(7){ left:82%; bottom:0; animation-delay:2.6s; }
  .ember:nth-child(8){ left:94%; bottom:0; animation-delay:4s; }
  @keyframes rise {
    0%   { transform:translateY(0) scale(1); opacity:0; }
    15%  { opacity:1; }
    100% { transform:translateY(-90vmin) scale(0.2); opacity:0; }
  }

  .star {
    position:absolute;
    color:#ffae00;
    font-size:clamp(24px, 4vmin, 60px);
    z-index:5;
    text-shadow: 0 0 14px rgba(255,107,0,1);
    animation: twinkle 2s ease-in-out infinite;
  }
  .star.s1 { top:7%;  left:7%;  }
  .star.s2 { top:7%;  right:7%; animation-delay:0.5s; }
  .star.s3 { bottom:7%; left:7%; animation-delay:1s; }
  .star.s4 { bottom:7%; right:7%; animation-delay:1.5s; }
  @keyframes twinkle {
    0%,100% { opacity:0.4; transform:scale(0.9) rotate(0); }
    50%     { opacity:1;   transform:scale(1.25) rotate(180deg); }
  }

  .sideline {
    position:absolute;
    height:3px;
    width:14%;
    background:linear-gradient(90deg, transparent, #ff6b00, transparent);
    z-index:3;
  }
  .sideline.l1 { top:50%; left:2%;    animation: lineL 2.4s ease-in-out infinite; }
  .sideline.l2 { top:50%; right:2%;   animation: lineR 2.4s ease-in-out infinite 1.2s; }
  @keyframes lineL {
    0%,100% { opacity:0.3; transform:translateX(-30px); }
    50%     { opacity:1;   transform:translateX(0); }
  }
  @keyframes lineR {
    0%,100% { opacity:0.3; transform:translateX(30px); }
    50%     { opacity:1;   transform:translateX(0); }
  }
</style>
</head>
<body>
  <div class="square">
    <div class="grid"></div>
    <div class="rays"></div>
    <div class="sun"></div>
    <div class="ring"></div>
    <div class="ring2"></div>

    <span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span>
    <span class="ember"></span><span class="ember"></span><span class="ember"></span><span class="ember"></span>

    <div class="star s1">✦</div>
    <div class="star s2">✦</div>
    <div class="star s3">✦</div>
    <div class="star s4">✦</div>

    <div class="sideline l1"></div>
    <div class="sideline l2"></div>

    <div class="top-tag">• A melhor org da city•</div>

    <div class="mega-wrap">
      <svg viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%"   stop-color="#fff1c2"/>
            <stop offset="20%"  stop-color="#ffd089"/>
            <stop offset="45%"  stop-color="#ffae00"/>
            <stop offset="70%"  stop-color="#ff6b00"/>
            <stop offset="90%"  stop-color="#ff3c00"/>
            <stop offset="100%" stop-color="#5a1000"/>
          </linearGradient>
        </defs>
        <text x="500" y="140"
              text-anchor="middle"
              font-family="Arial Black, sans-serif"
              font-weight="900"
              font-size="140"
              letter-spacing="2"
              fill="url(#fire)">TREMBALA</text>
      </svg>
    </div>

    <div class="bot-tag">Lider · DOTO  </div>

    <div class="sweep"></div>
    <div class="frame"></div>
  </div>
</body>
</html>
